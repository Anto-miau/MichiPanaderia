<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Michi Panadería</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div class="site-border">

        <div id="header"></div>

        <main class="main-content">

            <div class="user-access">
                <a href="../admin/index.html" class="btn-admin">⚙️ Acceso Admin</a> |
                <a href="../login/login.html" class="active">Iniciar sesión</a> | 
                <a href="../registro/index.html">Registrar usuario</a>
            </div>

            <section class="login-container">
                <div class="login-box">
                    <h2>INICIAR SESIÓN</h2>
                    <p>Ingresa tus datos para acceder a tu cuenta de Michi Panadería.</p>

                    <form action="#" method="POST" class="login-form">
                        <div class="form-group">
                            <label for="username">Usuario o Correo Electrónico:</label>
                            <input type="text" id="username" name="username" placeholder="ejemplo@michi.com" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Contraseña:</label>
                            <input type="password" id="password" name="password" placeholder="••••••••" required>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-login">Ingresar</button>
                            <a href="#" class="forgot-pass">¿Olvidaste tu contraseña?</a>
                        </div>
                    </form>
                </div>
            </section>

        </main>

        <footer class="bottom-footer">
            <div class="footer-col brand-info">
                <span>Michi Panadería</span>
            </div>

            <div class="footer-col footer-links">
                <a href="productos.html#panes">Panes Artesanales</a> | 
                <a href="productos.html#pasteles">Pastelería</a> | 
                <a href="productos.html#galletas">Galletas y Masas</a>
            </div>

            <div class="footer-col newsletter-box">
                <label for="email-foot">¡Suscríbete y recibe ofertas recién horneadas!</label>
                <form class="newsletter-form" action="#" method="POST">
                    <input type="email" id="email-foot" placeholder="Tu correo electrónico" required>
                    <button type="submit">Suscribirse</button>
                </form>
            </div>
        </footer>
    </div>

    <div id="footer"></div>

    <script src="../js/inyeccion.js" defer></script>
</body>
</html>
